<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22cc22"/>
      <stop offset="100%" style="stop-color:#33ff33"/>
    </linearGradient>
  </defs>

  <!-- Terminal window -->
  <rect x="100" y="120" width="312" height="272" rx="12" fill="#000000" stroke="url(#grad)" stroke-width="3"/>

  <!-- Title bar -->
  <line x1="100" y1="152" x2="412" y2="152" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <!-- Window dots -->
  <circle cx="124" cy="136" r="5" fill="#33ff33" opacity="0.6"/>
  <circle cx="142" cy="136" r="5" fill="#33ff33" opacity="0.4"/>
  <circle cx="160" cy="136" r="5" fill="#33ff33" opacity="0.25"/>

  <!-- BASIC code -->
  <g fill="#33ff33" font-family="'Courier New', monospace" font-weight="bold" font-size="18">
    <text x="124" y="186">10 PRINT "VIBE"</text>
    <text x="124" y="214">20 GOTO 10</text>
    <text x="124" y="250" opacity="0.7">&gt; RUN</text>
    <text x="124" y="286">VIBE</text>
    <text x="124" y="314">VIBE</text>
    <text x="124" y="342">VIBE</text>
    <text x="124" y="370" opacity="0.6">_</text>
  </g>

  <!-- Sine wave behind VIBE BASIC text (~54px amplitude, 1.5x the ~36px text height) -->
  <path d="M80,433 Q124,379 168,433 Q212,487 256,433 Q300,379 344,433 Q388,487 432,433" fill="none" stroke="#000000" stroke-width="6"/>
  <path d="M80,433 Q124,379 168,433 Q212,487 256,433 Q300,379 344,433 Q388,487 432,433" fill="none" stroke="#33ff33" stroke-width="2.5"/>

  <!-- VIBE BASIC label: thick black layer then green outline on top -->
  <text x="144" y="449" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="#000000" stroke="#000000" stroke-width="5">VIBE</text>
  <text x="260" y="446" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#000000" stroke="#000000" stroke-width="5">BASIC</text>
  <text x="144" y="449" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="none" stroke="#33ff33" stroke-width="1.5">VIBE</text>
  <text x="260" y="446" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="none" stroke="#33ff33" stroke-width="1.5">BASIC</text>
</svg>
