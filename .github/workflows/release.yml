name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - runner: ubuntu-latest
            target: aarch64-pc-windows-gnullvm
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Remove macOS-specific cargo config
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-musl]\nlinker = "musl-gcc"\n' > .cargo/config.toml

      - name: Setup cross-compilation (Linux to Windows)
        if: contains(matrix.target, 'windows') && runner.os == 'Linux'
        run: ./scripts/setup-cross-compile.sh

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: "!contains(matrix.target, 'windows')"
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vibe-basic-${{ matrix.target }}.tar.gz vibe-basic
          cd ../../..

      - name: Package artifact (Windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../vibe-basic-${{ matrix.target }}.zip vibe-basic.exe || zip ../../../vibe-basic-${{ matrix.target }}.zip vibe-basic.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-basic-${{ matrix.target }}
          path: |
            vibe-basic-*.tar.gz
            vibe-basic-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
