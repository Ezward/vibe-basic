name: Build and Test Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - runner: ubuntu-latest
            target: aarch64-pc-windows-gnullvm
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Remove macOS-specific cargo config
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-musl]\nlinker = "musl-gcc"\n' > .cargo/config.toml

      - name: Setup cross-compilation (Linux to Windows)
        if: contains(matrix.target, 'windows') && runner.os == 'Linux'
        run: ./scripts/setup-cross-compile.sh

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-basic-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/vibe-basic
            target/${{ matrix.target }}/release/vibe-basic.exe
          if-no-files-found: error

  test-artifacts:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            binary: vibe-basic
          - runner: macos-latest
            target: x86_64-apple-darwin
            binary: vibe-basic
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: vibe-basic
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: vibe-basic
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vibe-basic.exe

    runs-on: ${{ matrix.runner }}
    name: Test ${{ matrix.target }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibe-basic-${{ matrix.target }}

      - name: Run --version
        shell: bash
        run: |
          chmod +x ./${{ matrix.binary }} 2>/dev/null || true
          ./${{ matrix.binary }} --version
